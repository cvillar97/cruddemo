services:
  cruddemo_app:
    image: backend
    build: .
    mem_limit: 512m
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - mynetwork
    environment:
      - SERVER_PORT=8080
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: always

  db:
    image: mysql:8.3.0
    container_name: db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=employee_directory
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping" ,"-h", "db"]
      timeout: 5s
      retries: 5 
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge